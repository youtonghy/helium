# Official Chromium source code archive
# NOTE: Substitutions beginning with underscore are provided by utils
[chromium]
url = https://commondatastorage.googleapis.com/chromium-browser-official/chromium-%(_chromium_version)s-lite.tar.xz
download_filename = chromium-%(_chromium_version)s-lite.tar.xz
hash_url = chromium|chromium-%(_chromium_version)s-lite.tar.xz.hashes|https://commondatastorage.googleapis.com/chromium-browser-official/chromium-%(_chromium_version)s-lite.tar.xz.hashes
output_path = ./
strip_leading_dirs = chromium-%(_chromium_version)s

# Private CJK fallback used by Persona font virtualization. The complete
# official archive is pinned here, while Blink packages only the Regular OTF
# and its OFL license from the extracted directory.
[noto_sans_sc]
version = 2.004
url = https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/18_NotoSansSC.zip
download_filename = NotoSansSC-Sans%(version)s.zip
sha512 = bab0a9e3d10c6a97a3153b6966d54e105b95b2fd0decc5231f52fba4692b662e650ac423b8046475a3492d072aeb761ef6c058792014228dbf5c801b4a018a64
output_path = third_party/nitrous_fonts/noto_sans_sc
