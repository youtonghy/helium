name: CI setup
description: Shared setup for CI jobs

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: .cirrus_requirements.txt

    - name: Install runner packages
      shell: bash
      run: |
        # Package list lives in .ci_system_packages.txt so that local
        # CI-equivalent validation can check for the same binaries.
        packages="$(sed -e 's/#.*//' -e '/^\s*$/d' .ci_system_packages.txt | awk '{print $1}')"
        echo "Installing: ${packages}"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ${packages}

    - name: Install Python dependencies
      shell: bash
      run: python -m pip install -r .cirrus_requirements.txt
